{% extends "base.html" %}
{% block title %}Too Many Requests{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
        <i class="fas fa-hourglass-half text-danger" style="font-size: 5rem;"></i>
        <h2 class="mt-3">429 - Too Many Requests</h2>
        <p class="text-muted">You have made too many requests. Please wait before trying again.</p>
        <a href="{{ url_for('auth.login') }}" class="btn btn-primary">
            <i class="fas fa-home me-2"></i>Try Again
        </a>
    </div>
</div>
{% endblock %}
